---
- name: Практика - Деплой приложения
  hosts: ubuntu_servers
  become: yes

  vars:
    db_user: appuser
    db_password: secretpass
    db_name: myapp

  tasks:
    - name: Обновить кэш apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Установить Docker и pip3
      apt:
        name:
          - docker.io
          - python3-pip
          - python3-docker
        state: present

    - name: Убедиться, что Docker запущен
      service:
        name: docker
        state: started
        enabled: yes

    - name: Создать Docker сеть
      docker_network:
        name: app_network

    - name: Создать Docker volume
      docker_volume:
        name: db_data

    - name: Запустить PostgreSQL
      docker_container:
        name: postgres_db
        image: postgres:14
        state: started
        restart_policy: unless-stopped
        networks:
          - name: app_network
        volumes:
          - db_data:/var/lib/postgresql/data
        env:
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
          POSTGRES_DB: "{{ db_name }}"

    - name: Запустить Adminer
      docker_container:
        name: adminer
        image: adminer:4.8.1
        state: started
        restart_policy: unless-stopped
        networks:
          - name: app_network
        ports:
          - "8888:8080"
        env:
          ADMINER_DEFAULT_SERVER: postgres_db
